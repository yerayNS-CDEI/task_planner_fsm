# DISCOVER / OLIWALL GPR line-segmentation configuration.
# Paths are resolved relative to this file unless stated otherwise.

preprocessing:
  # For line detection the B-scan is intentionally NOT time-zero cropped and
  # background removal is NOT applied. The detector sees only a gain-adjusted
  # version of the complete acquisition so a shallow line cannot be cropped away.
  gain_db: 40.0
  plot:
    colormap: gray
    axes: false
    plot_scale: 8.0
    aspect_ratio: null
    render_upsample: 3.0

# Time zero is computed on the original raw matrix in a separate branch.
# It is used only after line detection to translate image coordinates to
# time/depth; it never crops the image passed to Berta's detector.
time_zero_reference:
  method: 2
  threshold: 0.20
  start_sample: 0
  backup_samples: 0

calibration:
  # GPRTools/segy_info.py applies the Proceq-confirmed -4 ns correction.
  expected_corrected_time_window_ns: 12.0
  epsilon_r_assumed: 6.0
  epsilon_r_basis: "representative concrete relative permittivity; assumed, not sensor-measured"
  c_m_per_ns: 0.299792458
  # Small tolerance for rendering/sample quantisation around the time-zero row.
  time_zero_depth_tolerance_samples: 1.0

outputs:
  # Default root when no output folder is given; each scan goes to <root>/<scan>/line.
  output_dir: ../../test_output
  # Deliverables: line_bscan_raw.png, line_bscan_processed.png, line_bscan_depth.png and
  # line_result.json (internal robot/POKEYE JSON). The global JSON is built by FULL PIPELINE/Global JSON.
  save_raw_image: true        # line_bscan_raw.png: B-scan as acquired, before any processing
  save_processed_image: true  # line_bscan_processed.png: gain-only image seen by Berta's detector
  save_depth_figure: true     # line_bscan_depth.png: B-scan with depth axis, lines and result table
